name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      dist:
        description: Name of an artifact holding the built dist/ to test instead of building one; skips the checkout test
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The project environment from pyproject.toml, with all dependency groups.
  # miRBench pins numpy<2, which has no wheels past Python 3.12.
  project-env:
    name: pytest (uv environment, Python 3.12)
    if: inputs.dist == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv pip show nwgrad
      - run: uv run pytest

  # The built wheel with only its own dependencies, as a pip user gets it. The
  # test suite comes from the checkout, but tests the installed package.
  package:
    name: pytest (wheel, ${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - if: inputs.dist == ''
        run: uv build
      - if: inputs.dist != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist }}
          path: dist/
      - name: Install the wheel
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl pytest
          uv pip show --python "$RUNNER_TEMP/venv" nwgrad numpy
      - name: Smoke test of the installed package
        working-directory: ${{ runner.temp }}
        run: |
          venv/bin/python -I -c "import discrimalign; from discrimalign import discrimalign, load_model, predict_csv; print(discrimalign.__module__)"
          venv/bin/discrimalign-infer --help
      - name: Test suite (miRBench tests need the project environment)
        env:
          DISCRIMALIGN_TEST_INSTALLED: "1"
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest --ignore=tests/test_mirbench.py
