name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      # This branch tests nwgrad_fill='rowwise', which needs nwgrad's unreleased
      # SeqPairBatch.fill: build nwgrad from its perf-dp branch over the locked wheel.
      - run: uv pip install "nwgrad @ git+https://github.com/michalsta/nwgrad@perf-dp"
      - run: uv pip show nwgrad
      - run: uv run --no-sync pytest
