name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Until nwgrad 0.5.0 is released, test against this nwgrad commit.
      NWGRAD_REV: e2f847a01e7879344f2f9174c9397576106db0ad
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: |
          uv pip install "nwgrad @ git+https://github.com/michalsta/nwgrad@${NWGRAD_REV}"
          uv pip show nwgrad
      - run: uv run --no-sync pytest
