[project]
name = "discrimalign"
version = "0.1.0"
description = "Discriminative alignment parameter learning from labelled biological sequence pairs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "biopython>=1.86",
    "joblib>=1.4.2",
    "numexpr>=2.10",
    "nwgrad>=0.7.0,<0.8",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.2",
    "scipy>=1.12.0",
]

[project.urls]
Repository = "https://github.com/BioGeMT/DiscrimAlign"

[project.scripts]
discrimalign-infer = "discrimalign.infer:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The code lives in src/ and is imported as `src` from the repository; the
# wheel installs the same directory as the `discrimalign` package.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "discrimalign"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.uv]
package = false
default-groups = ["dev", "research"]

[dependency-groups]
dev = [
    "pytest>=8",
]
# Case study, notebooks and the miRBench tests; not needed by the library.
research = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.2",
    "mirbench",
    "pandas>=2.2.2",
    "threadpoolctl>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# nwgrad API deprecated now is removed in its next minor release.
filterwarnings = ["error:.*is deprecated in nwgrad:DeprecationWarning"]
markers = [
    "slow: end-to-end runs on larger data (deselect with -m 'not slow'); the miRBench runs also need DISCRIMALIGN_RUN_MIRBENCH=1",
]
