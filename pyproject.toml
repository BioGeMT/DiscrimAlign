[project]
name = "discrimalign"
version = "0.1.0"
description = "Discriminative alignment parameter learning from labelled biological sequence pairs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.86",
    "ipykernel>=6.29.0",
    "joblib>=1.4.2",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.2",
    "mirbench",
    "nwgrad>=0.4.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.4.2",
    "scipy>=1.12.0",
    "threadpoolctl>=3.6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: end-to-end runs on larger simulated data (deselect with -m 'not slow')",
]
